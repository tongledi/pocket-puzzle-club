<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
<title id="title">Arrow Escape directional tiles</title><desc id="desc">A six-by-six ivory arrow board with one golden arrow finding a clear path to the right.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6ab88"/><stop offset="1" stop-color="#b97559"/></linearGradient>
  <radialGradient id="light" cx="28%" cy="10%" r="86%"><stop stop-color="#fff2cf" stop-opacity=".28"/><stop offset="1" stop-color="#fff2cf" stop-opacity="0"/></radialGradient>
  <linearGradient id="ivory" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#fffdf3"/><stop offset=".58" stop-color="#f7f0df"/><stop offset="1" stop-color="#e9dfc6"/></linearGradient>
  <linearGradient id="porcelain" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fffef4"/><stop offset="1" stop-color="#eae4d2"/></linearGradient>
  <linearGradient id="sage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#92ad8b"/><stop offset="1" stop-color="#4b765e"/></linearGradient>
  <linearGradient id="honey" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e1b16b"/><stop offset="1" stop-color="#a56e39"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ddc399"/><stop offset=".45" stop-color="#c5a577"/><stop offset="1" stop-color="#a98458"/></linearGradient>
  <filter id="shadow" x="-45%" y="-45%" width="210%" height="230%"><feDropShadow dx="0" dy="18" stdDeviation="17" flood-color="#10291e" flood-opacity=".26"/></filter>
  <filter id="pieceShadow" x="-40%" y="-40%" width="190%" height="210%"><feDropShadow dx="1" dy="7" stdDeviation="5" flood-color="#14261d" flood-opacity=".24"/></filter>
  <filter id="softShadow" x="-50%" y="-70%" width="200%" height="250%"><feGaussianBlur stdDeviation="16"/></filter>
