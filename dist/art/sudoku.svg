<title id="title">Sudoku paper number puzzle</title><desc id="desc">A nine-by-nine Sudoku puzzle on ivory paper, with distinct three-by-three boxes and a green selected centre cell.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b2b6b1"/><stop offset="1" stop-color="#777c89"/></linearGradient>
  <radialGradient id="light" cx="28%" cy="10%" r="86%"><stop stop-color="#fff2cf" stop-opacity=".28"/><stop offset="1" stop-color="#fff2cf" stop-opacity="0"/></radialGradient>
  <linearGradient id="ivory" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#fffdf3"/><stop offset=".58" stop-color="#f7f0df"/><stop offset="1" stop-color="#e9dfc6"/></linearGradient>
